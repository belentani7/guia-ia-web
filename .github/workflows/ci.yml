name: Guía IA — Release quality
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Node 22 / plan + types + Vite + API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # package.json packageManager pins pnpm; declaring a second version breaks setup.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Reproducible install
        run: pnpm install --frozen-lockfile
      - name: Interactive course-plan tests
        run: pnpm test
      - name: HTTP routing contract regression
        run: pnpm run test:server
      - name: Strict TypeScript check
        run: pnpm run check
      - name: Full front and server build
        run: pnpm run build
